# Claude Code automated MR review → Jira issues + MR comment
#
# Required CI/CD variables (Settings → CI/CD → Variables):
#   ANTHROPIC_AUTH_TOKEN — Bearer token for Anthropic API or compatible gateway (masked)
#   ANTHROPIC_BASE_URL   — Optional API/gateway endpoint (e.g. https://your-gateway/v1)
#                          Protected variables are only injected on protected branches/tags.
#   JIRA_BASE_URL       — e.g. https://your-org.atlassian.net
#   JIRA_EMAIL          — Jira account email for API auth
#   JIRA_API_TOKEN      — Jira API token (masked)
#   JIRA_PROJECT_KEY    — Jira project key, e.g. RANCHER
#   JIRA_WORKLOG_ISSUE_KEY — Issue key to log review time against (default: SCRUM-1)
#
# Optional:
#   GITLAB_ACCESS_TOKEN — Project/group PAT with api scope for MR comments + Jira push
#                         (defaults to CI_JOB_TOKEN; may need PAT if job token lacks write access)
#   JIRA_ISSUE_TYPE     — Default: Task
#   JIRA_LABELS         — Default: code-review,claude-ci
#   JIRA_WORKLOG_TIME_SPENT — Default: 15m (Jira format, e.g. 30m, 1h)
#   CLAUDE_MODEL        — e.g. claude-sonnet-4-6
#   CLAUDE_MAX_TURNS    — Default: 25
#
# Runner: self-hosted Ubuntu runner with tags desktop + linux (shell executor).
# Pre-install on the runner once: jq gettext-base (CI cannot use interactive sudo).
# GitLab matches jobs to runners by tags — there is no manual runner picker on Run pipeline.

stages:
  - review

variables:
  GIT_STRATEGY: fetch
  GIT_DEPTH: "0"

claude-code-review:
  stage: review
  tags:
    - linux
    - ubuntu
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
  timeout: 30m
  before_script:
    - |
      set -euo pipefail
      curl https://mise.run | sh
      export PATH="$HOME/.local/bin:$PATH"
      mise use -g node@22
      # mise installs node shims here — ~/.local/bin alone does not include node.
      export PATH="$HOME/.local/share/mise/shims:$HOME/.local/bin:$PATH"
      node --version
      npm --version
    - echo "Pipeline commit ${CI_COMMIT_SHA}"
    - head -n 12 ci/setup-claude-review.sh
    - export PATH="$HOME/.local/share/mise/shims:$HOME/.local/bin:$PATH"
    - curl -fsSL https://claude.ai/install.sh | bash
    - export PATH="$HOME/.local/share/mise/shims:$HOME/.local/bin:$PATH"
    - command -v claude
    - command -v node
    - chmod +x ci/setup-claude-review.sh ci/run-claude-review.sh ci/post-jira-worklog.sh
    - ./ci/setup-claude-review.sh
  script:
    - export PATH="$HOME/.local/share/mise/shims:$HOME/.local/bin:$PATH"
    - ./ci/run-claude-review.sh
  after_script:
    - export PATH="$HOME/.local/share/mise/shims:$HOME/.local/bin:$PATH"
    - ./ci/post-jira-worklog.sh
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - claude-review-result.json
  allow_failure: true
