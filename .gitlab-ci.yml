# Claude Code automated MR review → Jira issues + MR comment
#
# Required CI/CD variables (Settings → CI/CD → Variables):
#   ANTHROPIC_API_KEY   — Anthropic API key (masked); use for direct Anthropic API access
#   — OR —
#   ANTHROPIC_AUTH_TOKEN — Bearer token for a compatible gateway/proxy (masked)
#   ANTHROPIC_BASE_URL   — Gateway endpoint (e.g. https://your-gateway/v1); pair with AUTH_TOKEN
#                          When using AUTH_TOKEN, leave ANTHROPIC_API_KEY unset so Claude Code
#                          does not bypass the gateway.
#   JIRA_BASE_URL       — e.g. https://your-org.atlassian.net
#   JIRA_EMAIL          — Jira account email for API auth
#   JIRA_API_TOKEN      — Jira API token (masked)
#   JIRA_PROJECT_KEY    — Jira project key, e.g. RANCHER
#
# Optional:
#   GITLAB_ACCESS_TOKEN — Project/group PAT with api scope for MR comments + Jira push
#                         (defaults to CI_JOB_TOKEN; may need PAT if job token lacks write access)
#   JIRA_ISSUE_TYPE     — Default: Task
#   JIRA_LABELS         — Default: code-review,claude-ci
#   CLAUDE_MODEL        — e.g. claude-sonnet-4-6
#   CLAUDE_MAX_TURNS    — Default: 25

stages:
  - review

variables:
  GIT_STRATEGY: fetch
  GIT_DEPTH: "0"

claude-code-review:
  stage: review
  image: node:24-alpine3.21
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $RUN_CLAUDE_REVIEW == "true"'
      when: manual
  timeout: 30m
  before_script:
    - export PATH="$HOME/.local/bin:$PATH"
    - apk add --no-cache git curl bash jq gettext
    - curl -fsSL https://claude.ai/install.sh | bash
    - export PATH="$HOME/.local/bin:$PATH"
    - command -v claude
    - chmod +x ci/setup-claude-review.sh ci/run-claude-review.sh
    - ./ci/setup-claude-review.sh
  script:
    - ./ci/run-claude-review.sh
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - claude-review-result.json
  allow_failure: true
