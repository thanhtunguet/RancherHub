name: Docker Build (legacy NestJS backend)

# Manual only. The NestJS backend was replaced by the Go backend on 2026-05-20
# (see AGENTS.md, "Backend history"). `main` can no longer build it because
# apps/backend/package.json now contains only Go scripts, so this workflow builds
# it from a pinned historical ref instead. Image: <namespace>/rancher-hub-backend.
#
# Tags pushed: `legacy` and `legacy-<short sha of ref>`.
# `latest` is intentionally NOT touched (it still holds the last published NestJS build).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (default: last NestJS-only commit; a branch such as nodejs also works)"
        required: true
        default: "ab3dd4708a4f4d6ff7ce470096c835f11890cc82"
      push:
        description: "Push the image to Docker Hub (untick for a build-only dry run)"
        type: boolean
        default: true

env:
  DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME || 'thanhtunguet' }}

jobs:
  build-legacy-nestjs:
    runs-on: ubuntu-latest
    name: Build legacy NestJS backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The legacy Dockerfile.backend copies a pre-built apps/backend/dist, so build it first.
      - name: Install dependencies
        run: npm ci --include=optional

      - name: Build backend
        run: npm run build --workspace=rancher-hub-backend

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: inputs.push
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: ref
        name: Resolve short sha of the built ref
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_NAMESPACE }}/rancher-hub-backend
          tags: |
            type=raw,value=legacy
            type=raw,value=legacy-${{ steps.ref.outputs.short }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.backend
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=legacy-nestjs
          cache-to: type=gha,mode=max,scope=legacy-nestjs
