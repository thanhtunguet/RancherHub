name: Docker Builds

# Builds the current stack only: Go backend (rancher-hub-go) and frontend.
# The legacy NestJS backend (rancher-hub-backend) is NOT built here; rebuild it
# on demand with the manual workflow "Docker Build (legacy NestJS backend)".

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME || 'thanhtunguet' }}

jobs:
  build-go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [arm64, amd64]
    name: Build Go backend (${{ matrix.arch }})
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: go-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_NAMESPACE }}/rancher-hub-go
          tags: |
            type=raw,value=${{ matrix.arch }}
            type=raw,value=${{ matrix.arch }}-latest,enable={{is_default_branch}}
            type=raw,value=${{ matrix.arch }}-sha-${{ github.sha }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.backend
          platforms: linux/${{ matrix.arch }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.go-meta.outputs.tags }}
          labels: ${{ steps.go-meta.outputs.labels }}
          cache-from: type=gha,scope=go-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=go-${{ matrix.arch }}

  build-frontend:
    runs-on: ubuntu-latest
    name: Build frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_NAMESPACE }}/rancher-hub-frontend
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=amd64
            type=raw,value=amd64-latest,enable={{is_default_branch}}
            type=raw,value=amd64-sha-${{ github.sha }}
            type=raw,value=arm64
            type=raw,value=arm64-latest,enable={{is_default_branch}}
            type=raw,value=arm64-sha-${{ github.sha }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.frontend
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  publish-go-manifest:
    runs-on: ubuntu-latest
    needs: build-go
    if: github.event_name == 'push'
    name: Publish Go backend multi-arch manifest
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish manifest
        run: |
          image="${{ env.DOCKERHUB_NAMESPACE }}/rancher-hub-go"
          tags=("-t" "$image:sha-${{ github.sha }}")

          if [ "${{ github.ref }}" = "refs/heads/${{ github.event.repository.default_branch }}" ]; then
            tags+=("-t" "$image:latest")
          fi

          docker buildx imagetools create \
            "${tags[@]}" \
            "$image:amd64-sha-${{ github.sha }}" \
            "$image:arm64-sha-${{ github.sha }}"
