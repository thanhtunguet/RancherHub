name: Docker Builds

on:
  push:
    branches:
      - main
      - golang
  pull_request:
    branches:
      - main
      - golang
  workflow_dispatch:

env:
  DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME || 'thanhtunguet' }}

jobs:
  build-backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [arm64, amd64]
    name: Build backend (${{ matrix.arch }})
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_NAMESPACE }}/rancher-hub-backend
          tags: |
            type=raw,value=${{ matrix.arch }}
            type=raw,value=${{ matrix.arch }}-latest,enable={{is_default_branch}}
            type=raw,value=${{ matrix.arch }}-sha-${{ github.sha }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.backend
          platforms: linux/${{ matrix.arch }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          cache-from: type=gha,scope=backend-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=backend-${{ matrix.arch }}

  build-frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [arm64, amd64]
    name: Build frontend (${{ matrix.arch }})
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Build frontend
        run: pnpm --filter rancher-hub-frontend build

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_NAMESPACE }}/rancher-hub-frontend
          tags: |
            type=raw,value=${{ matrix.arch }}
            type=raw,value=${{ matrix.arch }}-latest,enable={{is_default_branch}}
            type=raw,value=${{ matrix.arch }}-sha-${{ github.sha }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.frontend
          platforms: linux/${{ matrix.arch }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          cache-from: type=gha,scope=frontend-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=frontend-${{ matrix.arch }}

  publish-backend-manifest:
    runs-on: ubuntu-latest
    needs: build-backend
    if: github.event_name == 'push'
    name: Publish backend multi-arch manifest
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish manifest
        run: |
          image="${{ env.DOCKERHUB_NAMESPACE }}/rancher-hub-backend"
          tags=("-t" "$image:sha-${{ github.sha }}")

          if [ "${{ github.ref }}" = "refs/heads/${{ github.event.repository.default_branch }}" ]; then
            tags+=("-t" "$image:latest")
          fi

          docker buildx imagetools create \
            "${tags[@]}" \
            "$image:amd64-sha-${{ github.sha }}" \
            "$image:arm64-sha-${{ github.sha }}"

  publish-frontend-manifest:
    runs-on: ubuntu-latest
    needs: build-frontend
    if: github.event_name == 'push'
    name: Publish frontend multi-arch manifest
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish manifest
        run: |
          image="${{ env.DOCKERHUB_NAMESPACE }}/rancher-hub-frontend"
          tags=("-t" "$image:sha-${{ github.sha }}")

          if [ "${{ github.ref }}" = "refs/heads/${{ github.event.repository.default_branch }}" ]; then
            tags+=("-t" "$image:latest")
          fi

          docker buildx imagetools create \
            "${tags[@]}" \
            "$image:amd64-sha-${{ github.sha }}" \
            "$image:arm64-sha-${{ github.sha }}"
